<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>velt-customize · run replay</title>
<!--
  obs-player.html — the session-replay UI for one velt-customize phase.
  Generated by scripts/obs.mjs build: the placeholder below is replaced with the run's inlined
  data (events.jsonl + blocks.json + loop-state.json + stage-state.json + block-report.json +
  progress.log). Images stay RELATIVE (../frames/…, snapshots/…) so the page works over file://
  as well as `obs.mjs serve`. Zero dependencies by design.
-->
<style>
  :root {
    --bg: #101319; --bg2: #171b23; --bg3: #1f2430; --line: #2a3040;
    --fg: #dbe2ee; --fg-dim: #8b94a7; --fg-faint: #5b6375;
    --accent: #5aa2ff; --ok: #3fb96c; --bad: #e5534b; --warn: #d9a13b; --neutral: #6b7385;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: grid; grid-template-rows: 44px 1fr auto; overflow: hidden;
  }
  button { font: inherit; color: inherit; background: var(--bg3); border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.active { background: var(--accent); color: #0b1220; border-color: var(--accent); font-weight: 600; }
  select, input[type=text] { font: inherit; color: var(--fg); background: var(--bg3); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
  ::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }

  /* ---------- header ---------- */
  #hdr { display: flex; align-items: center; gap: 12px; padding: 0 14px; border-bottom: 1px solid var(--line); background: var(--bg2); }
  #hdr .title { font-weight: 700; letter-spacing: .2px; }
  #hdr .phase { font-family: var(--mono); color: var(--fg-dim); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; letter-spacing: .4px; }
  .badge.PASS { background: #14351f; color: #59d98a; } .badge.FAIL { background: #3a1715; color: #ff8b84; }
  .badge.INCOMPLETE, .badge.UNKNOWN { background: #3a2d12; color: #f0c064; } .badge.STOPPED { background: #262b38; color: #aab3c5; }
  #hdr .stats { margin-left: auto; color: var(--fg-dim); font-size: 12px; display: flex; gap: 14px; }
  #hdr .stats b { color: var(--fg); font-weight: 600; }

  /* ---------- main 3-pane ---------- */
  #main { display: grid; grid-template-columns: 290px 1fr 360px; min-height: 0; }
  .pane { min-height: 0; overflow: auto; }
  #rail { border-right: 1px solid var(--line); background: var(--bg2); padding: 8px; }
  #details { border-left: 1px solid var(--line); background: var(--bg2); padding: 10px 12px; }

  /* left rail */
  .rail-h { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--fg-faint); margin: 10px 4px 4px; }
  .stage-row, .block-row { display: flex; align-items: center; gap: 8px; padding: 5px 7px; border-radius: 7px; cursor: pointer; }
  .stage-row:hover, .block-row:hover { background: var(--bg3); }
  .block-row.filtered { outline: 1px solid var(--accent); background: var(--bg3); }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); } .dot.neutral { background: var(--neutral); }
  .block-row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .block-row .disp { font-size: 10px; font-weight: 700; color: var(--fg-dim); }
  .block-row .disp.PASS { color: var(--ok); } .block-row .disp.STUCK, .block-row .disp.FAIL { color: var(--bad); }
  .block-row .disp.BLOCKED, .block-row .disp.GAP, .block-row .disp.UNVERIFIED { color: var(--warn); }
  .spark { flex: none; }

  /* viewer */
  #viewer { display: flex; flex-direction: column; min-width: 0; }
  #vtabs { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); align-items: center; }
  #vtabs .spacer { flex: 1; }
  #vwrap { flex: 1; min-height: 0; overflow: auto; display: flex; align-items: flex-start; justify-content: center; padding: 14px; background:
    repeating-conic-gradient(#141821 0% 25%, #10141c 0% 50%) 0 0 / 22px 22px; }
  #vwrap img { max-width: 100%; height: auto; box-shadow: 0 4px 30px rgba(0,0,0,.45); border-radius: 4px; background: #fff; }
  #vwrap.actual img { max-width: none; }
  #shotmeta { padding: 5px 12px; color: var(--fg-dim); font-size: 11px; border-top: 1px solid var(--line); font-family: var(--mono);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .placeholder { color: var(--fg-dim); text-align: center; margin-top: 60px; max-width: 420px; }
  .placeholder code { font-family: var(--mono); background: var(--bg3); padding: 1px 6px; border-radius: 5px; }

  /* compare slider */
  #cmp { position: relative; display: inline-block; max-width: 100%; }
  #cmp img { display: block; }
  #cmp .top { position: absolute; inset: 0; overflow: hidden; }
  #cmp .top img { position: absolute; left: 0; top: 0; max-width: none; }
  #cmp .handle { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); cursor: ew-resize; }
  #cmp .handle::after { content: "◂ ▸"; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    background: var(--accent); color: #0b1220; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 999px; white-space: nowrap; }
  #cmp .tag { position: absolute; top: 8px; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; background: rgba(0,0,0,.55); color: #fff; }

  /* details */
  #details h3 { margin: 4px 0 8px; font-size: 13px; }
  .kv { display: grid; grid-template-columns: 92px 1fr; gap: 3px 10px; font-size: 12px; margin-bottom: 10px; }
  .kv .k { color: var(--fg-faint); } .kv .v { font-family: var(--mono); word-break: break-word; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0 10px; }
  .chip { font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--bg3); color: var(--fg-dim); border: 1px solid var(--line); }
  .chip.bad { color: #ff8b84; border-color: #5c2320; } .chip.ok { color: #59d98a; border-color: #1d4a2c; } .chip.warn { color: #f0c064; border-color: #574414; }
  details.raw { margin-top: 8px; } details.raw summary { cursor: pointer; color: var(--fg-dim); font-size: 12px; }
  pre.json { font-family: var(--mono); font-size: 11px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px; overflow: auto; max-height: 300px; white-space: pre-wrap; word-break: break-word; }
  .difftable { width: 100%; border-collapse: collapse; font-size: 11px; margin: 6px 0; }
  .difftable th, .difftable td { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--line); font-family: var(--mono); vertical-align: top; }
  .difftable th { color: var(--fg-faint); font-weight: 600; }
  a.art { color: var(--accent); text-decoration: none; font-family: var(--mono); font-size: 11px; } a.art:hover { text-decoration: underline; }

  /* ---------- bottom: controls + timeline + filmstrip ---------- */
  #bottom { border-top: 1px solid var(--line); background: var(--bg2); }
  #controls { display: flex; align-items: center; gap: 8px; padding: 7px 12px 3px; }
  #controls .sep { width: 1px; height: 18px; background: var(--line); margin: 0 3px; }
  #poslbl { font-family: var(--mono); font-size: 11px; color: var(--fg-dim); min-width: 170px; }
  #tl { position: relative; height: 74px; margin: 4px 12px 2px; cursor: crosshair; }
  #tl canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  #tltip { position: fixed; z-index: 10; pointer-events: none; background: #0c0f15; border: 1px solid var(--line); border-radius: 7px;
    padding: 6px 9px; font-size: 11px; max-width: 420px; display: none; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
  #tltip .t { color: var(--fg-faint); font-family: var(--mono); }
  #strip { display: flex; gap: 6px; overflow-x: auto; padding: 6px 12px 10px; }
  #strip .fr { flex: none; width: 86px; cursor: pointer; border: 2px solid transparent; border-radius: 6px; overflow: hidden; background: var(--bg3); }
  #strip .fr.sel { border-color: var(--accent); }
  #strip .fr img { width: 100%; height: 54px; object-fit: cover; object-position: top; display: block; background: #fff; }
  #strip .fr .cap { font-size: 9px; padding: 1px 4px; color: var(--fg-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); }
  kbd { font-family: var(--mono); font-size: 10px; background: var(--bg3); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
  <div id="hdr">
    <span class="title">velt-customize · run replay</span>
    <span class="phase" id="hPhase"></span>
    <span class="badge UNKNOWN" id="hVerdict">NO VERDICT</span>
    <span class="stats" id="hStats"></span>
  </div>

  <div id="main">
    <div id="rail" class="pane">
      <div class="rail-h">Run stages</div>
      <div id="stageList"></div>
      <div class="rail-h">Loops · blocks <span id="blockFilterHint" style="text-transform:none;letter-spacing:0"></span></div>
      <div id="blockList"></div>
    </div>

    <div id="viewer">
      <div id="vtabs">
        <button data-tab="live" class="active">Live</button>
        <button data-tab="ref">Reference</button>
        <button data-tab="diff">Diff</button>
        <button data-tab="cmp">Compare</button>
        <span class="spacer"></span>
        <button id="fitBtn" title="toggle fit / actual pixels">Fit</button>
      </div>
      <div id="vwrap"></div>
      <div id="shotmeta"></div>
    </div>

    <div id="details" class="pane"></div>
  </div>

  <div id="bottom">
    <div id="controls">
      <button id="btnFirst" title="first event">⏮</button>
      <button id="btnPrev" title="previous (←)">◀</button>
      <button id="btnPlay" title="play/pause (space)">▶ Play</button>
      <button id="btnNext" title="next (→)">▶</button>
      <button id="btnLast" title="last event">⏭</button>
      <select id="speed"><option value="1200">0.5×</option><option value="600" selected>1×</option><option value="300">2×</option><option value="150">4×</option><option value="75">8×</option></select>
      <span class="sep"></span>
      <span id="poslbl"></span>
      <span class="sep"></span>
      <label style="color:var(--fg-dim);font-size:12px"><input type="checkbox" id="showLogs"> heartbeat lines</label>
      <label style="color:var(--fg-dim);font-size:12px"><input type="checkbox" id="onlyIssues"> issues only</label>
      <input type="text" id="q" placeholder="filter text…" style="width:150px">
      <span style="margin-left:auto;color:var(--fg-faint);font-size:11px"><kbd>←</kbd><kbd>→</kbd> step · <kbd>space</kbd> play</span>
    </div>
    <div id="tl"><canvas id="tlc"></canvas></div>
    <div id="strip"></div>
  </div>
  <div id="tltip"></div>

<script>
"use strict";
// ---------------------------------------------------------------------------- data
const RUN = /*__VELT_OBS_RUN_DATA__*/null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// phaseDir-relative → player-relative; an --inline build carries RUN.assets (path → data: URI) instead
const rel = (p) => { if (!p) return null; const n = String(p).replace(/^\.?\//, ""); return (RUN.assets && RUN.assets[n]) || "../" + n; };
const fmtT = (iso) => iso ? iso.slice(11, 19) + "Z" : "—";
const fmtDur = (ms) => { if (ms == null) return "—"; const s = Math.round(ms / 1000); return s < 90 ? s + "s" : (s / 60).toFixed(1) + "m"; };

if (!RUN) { document.body.innerHTML = "<div class='placeholder' style='margin:80px auto'>No run data was injected — regenerate this page with <code>node scripts/obs.mjs build &lt;phaseDir&gt;</code>.</div>"; throw new Error("no data"); }

const EVENTS = (RUN.events || []).slice().sort((a, b) => String(a.t).localeCompare(String(b.t)));
EVENTS.forEach((e, i) => { e._i = i; e._s = JSON.stringify(e).toLowerCase(); });   // _s: precomputed filter haystack
const T0 = EVENTS.length ? new Date(EVENTS[0].t).getTime() : Date.now();
const T1 = EVENTS.length ? new Date(EVENTS[EVENTS.length - 1].t).getTime() : T0 + 1;
const SPAN = Math.max(1, T1 - T0);
const BLOCKS = (RUN.blocks && RUN.blocks.blocks) || [];
const REPORT = (RUN.blockReport && RUN.blockReport.blocks) || {};
const LOOP = RUN.loopState || {};

// severity: bad > warn > ok > neutral (drives tick colors, dots, filters)
function sevOf(e) {
  if (e.ok === false || e.type === "measure.fail" || (e.type === "disposition" && /STUCK|BLOCKED/.test(e.data?.disposition || ""))) return "bad";
  if (e.type === "stage.timeout" || e.type === "phase.softcap" || e.type === "pause" ||
      (e.type === "verdict" && e.data?.verdict !== "PASS") || (e.type === "iter.record" && e.data?.verdict === "ESCALATE") ||
      (e.type === "iter.record" && e.data?.signals && (e.data.signals.noProgress || e.data.signals.repeatHash || e.data.signals.oscillation))) return "warn";
  if (e.ok === true || (e.type === "verdict" && e.data?.verdict === "PASS")) return "ok";
  return "neutral";
}
const SEVC = { bad: "#e5534b", warn: "#d9a13b", ok: "#3fb96c", neutral: "#6b7385" };

// disposition per block, mirroring write-handoff's honest rules
function dispOf(id) {
  const r = REPORT[id];
  if (!r || !r.built) return "UNVERIFIED";
  const d = typeof r.disposition === "string" ? r.disposition.toUpperCase() : null;
  if (d) return d;
  const checked = (r.deltaCompare && r.deltaCompare.checked || []).length;
  if (r.driven && r.deltaCompare?.ok && r.stability?.ok && checked >= 2 && r.artifacts) return "PASS";
  return "UNVERIFIED";
}

// ---------------------------------------------------------------------------- state
let sel = -1;                 // selected event index (into EVENTS)
let tab = "live";
let playing = false, playTimer = null;
let blockFilter = null;       // blockId or null
let fitMode = true;

function visible(e) {
  if (e.type === "log" && !$("#showLogs").checked) return false;
  if ($("#onlyIssues").checked && !["bad", "warn"].includes(sevOf(e))) return false;
  if (blockFilter && e.blockId && e.blockId !== blockFilter) return false;
  if (blockFilter && !e.blockId && !["run.start", "verdict", "handoff"].includes(e.type)) return false;
  const q = $("#q").value.trim().toLowerCase();
  if (q && !e._s.includes(q)) return false;
  return true;
}
const visibleIdx = () => EVENTS.filter(visible).map((e) => e._i);

// nearest shots for an event: its own, else the latest earlier snapshot of the same block
function shotsFor(e) {
  if (!e) return { shots: null, from: null };
  if (e.shots && (e.shots.live || e.shots.diff || e.shots.ref)) return { shots: e.shots, from: e };
  if (e.blockId) {
    for (let i = e._i; i >= 0; i--) {
      const p = EVENTS[i];
      if (p.blockId === e.blockId && p.shots && (p.shots.live || p.shots.diff)) return { shots: p.shots, from: p };
    }
    const b = BLOCKS.find((x) => x.id === e.blockId);
    if (b && b.framePng) return { shots: { ref: b.framePng }, from: null };
  }
  return { shots: null, from: null };
}

// ---------------------------------------------------------------------------- header
(function header() {
  $("#hPhase").textContent = RUN.phaseId || "";
  let verdict = null;
  for (let i = EVENTS.length - 1; i >= 0; i--) {
    const e = EVENTS[i];
    if ((e.type === "verdict" || e.type === "handoff") && e.data?.verdict) { verdict = e.data.verdict; break; }
  }
  if (verdict) { const b = $("#hVerdict"); b.textContent = verdict; b.className = "badge " + verdict; }
  const iters = Object.values(LOOP.blocks || {}).reduce((n, b) => n + (b.attempts || []).length, 0);
  const shots = EVENTS.filter((e) => e.shots && e.shots.live).length;
  $("#hStats").innerHTML =
    `<span><b>${EVENTS.length}</b> events</span><span><b>${BLOCKS.length}</b> blocks</span>` +
    `<span><b>${iters}</b> iterations</span><span><b>${shots}</b> screenshots</span>` +
    `<span>span <b>${fmtDur(SPAN)}</b></span><span style="color:var(--fg-faint)">built ${fmtT(RUN.generatedAt)}</span>`;
})();

// ---------------------------------------------------------------------------- left rail
function sparkline(attempts) {
  const a = (attempts || []).map((x) => x.diffCount);
  if (!a.length) return "";
  const w = 56, h = 16, max = Math.max(...a, 1);
  const pts = a.map((v, i) => `${(a.length === 1 ? w / 2 : i * (w - 4) / (a.length - 1) + 2).toFixed(1)},${(h - 2 - (v / max) * (h - 5)).toFixed(1)}`);
  const last = a[a.length - 1];
  const col = last === 0 ? "var(--ok)" : a.length > 1 && last < a[0] ? "var(--warn)" : "var(--bad)";
  return `<svg class="spark" width="${w}" height="${h}" aria-label="diffCount per iteration: ${a.join(",")}">` +
    `<polyline points="${pts.join(" ")}" fill="none" stroke="${col}" stroke-width="1.5"/>` +
    pts.map((p, i) => `<circle cx="${p.split(",")[0]}" cy="${p.split(",")[1]}" r="1.6" fill="${a[i] === 0 ? "var(--ok)" : col}"/>`).join("") + `</svg>`;
}

function renderRail() {
  // stages: from stage-state + run-level events
  const st = (RUN.stageState && RUN.stageState.stages) || {};
  const rows = [];
  for (const [name, s] of Object.entries(st)) {
    const dur = s.endedAt ? `${s.durationMin}m` : "open";
    const cls = s.stoppedByTimer ? "warn" : s.endedAt ? "ok" : "neutral";
    rows.push(`<div class="stage-row" data-jumpstage="${esc(name)}"><span class="dot ${cls}"></span><span class="nm">${esc(name)}</span><span class="disp">${dur}${s.stoppedByTimer ? " ■cap" : ""}</span></div>`);
  }
  for (const e of EVENTS) if (["verdict", "handoff"].includes(e.type))
    rows.push(`<div class="stage-row" data-jump="${e._i}"><span class="dot ${sevOf(e)}"></span><span class="nm">${esc(e.type)}</span><span class="disp">${esc(e.data?.verdict || "")}</span></div>`);
  $("#stageList").innerHTML = rows.join("") || `<div style="color:var(--fg-faint);padding:4px 7px">no stage timers recorded</div>`;

  const bl = [];
  for (const b of BLOCKS) {
    const disp = dispOf(b.id);
    const att = LOOP.blocks && LOOP.blocks[b.id] && LOOP.blocks[b.id].attempts;
    const dotCls = disp === "PASS" ? "ok" : ["STUCK", "FAIL"].includes(disp) ? "bad" : disp === "UNVERIFIED" && !(REPORT[b.id]) ? "neutral" : "warn";
    bl.push(`<div class="block-row${blockFilter === b.id ? " filtered" : ""}" data-block="${esc(b.id)}" title="${esc(b.name || b.id)} — click to filter the timeline to this loop">` +
      `<span class="dot ${dotCls}"></span><span class="nm">${esc(b.id)}</span>${sparkline(att)}<span class="disp ${disp}">${disp}</span></div>`);
  }
  // events for blocks that never made it into blocks.json (early failures) still deserve a lane
  const known = new Set(BLOCKS.map((b) => b.id));
  for (const id of new Set(EVENTS.map((e) => e.blockId).filter((x) => x && !known.has(x))))
    bl.push(`<div class="block-row${blockFilter === id ? " filtered" : ""}" data-block="${esc(id)}"><span class="dot neutral"></span><span class="nm">${esc(id)}</span><span class="disp">?</span></div>`);
  $("#blockList").innerHTML = bl.join("") || `<div style="color:var(--fg-faint);padding:4px 7px">no blocks enumerated</div>`;
  $("#blockFilterHint").textContent = blockFilter ? `· filtered: ${blockFilter} (click again to clear)` : "";

  $("#blockList").querySelectorAll(".block-row").forEach((el) => el.onclick = () => {
    blockFilter = blockFilter === el.dataset.block ? null : el.dataset.block;
    const ids = visibleIdx();
    if (blockFilter && ids.length) select(ids[0]);
    renderAll();
  });
  $("#stageList").querySelectorAll("[data-jump]").forEach((el) => el.onclick = () => select(+el.dataset.jump));
  $("#stageList").querySelectorAll("[data-jumpstage]").forEach((el) => el.onclick = () => {
    const name = el.dataset.jumpstage;
    const e = EVENTS.find((x) => x.stage === name && x.type === "stage.start") || EVENTS.find((x) => x.stage === name);
    if (e) select(e._i);
  });
}

// ---------------------------------------------------------------------------- viewer
function renderViewer() {
  const e = EVENTS[sel];
  const { shots, from } = shotsFor(e);
  const wrap = $("#vwrap");
  wrap.classList.toggle("actual", !fitMode);
  $("#fitBtn").textContent = fitMode ? "Fit" : "1:1";
  const meta = $("#shotmeta");
  const note = from && e && from._i !== e._i ? ` · showing nearest snapshot (event #${from._i + 1}, ${fmtT(from.t)})` : "";

  if (!e) { wrap.innerHTML = `<div class="placeholder">Select an event on the timeline below.</div>`; meta.textContent = ""; return; }
  if (!shots) {
    wrap.innerHTML = `<div class="placeholder"><b>${esc(e.type)}</b> — no screenshot is attached to this event${e.blockId ? "" : " (run-level event)"}.<br><br>` +
      `Screenshots appear on <code>measure</code> events; if none exist yet the run hasn't reached a measurement.</div>`;
    meta.textContent = ""; return;
  }
  const src = { live: shots.live, ref: shots.ref, diff: shots.diff }[tab];
  if (tab === "cmp") {
    if (!shots.ref || !shots.live) {
      wrap.innerHTML = `<div class="placeholder">Compare needs BOTH a reference frame and a live capture — this event has ${shots.ref ? "only the reference" : shots.live ? "only the live shot" : "neither"}.</div>`;
    } else {
      wrap.innerHTML = `<div id="cmp">
          <img src="${esc(rel(shots.ref))}" alt="reference frame" onerror="this.closest('#vwrap').innerHTML='<div class=placeholder>reference image missing on disk</div>'">
          <div class="top"><img src="${esc(rel(shots.live))}" alt="live capture"></div>
          <div class="handle"></div>
          <span class="tag" style="left:8px">REFERENCE (Figma)</span><span class="tag" style="right:8px">LIVE</span>
        </div>`;
      initCompare();
    }
  } else if (!src) {
    wrap.innerHTML = `<div class="placeholder">No <b>${esc(tab)}</b> image for this event${shots.live || shots.ref ? " — try another tab" : ""}.</div>`;
  } else {
    const img = document.createElement("img");
    img.src = rel(src);
    img.alt = tab + " screenshot";
    img.onerror = () => img.replaceWith(Object.assign(document.createElement("div"), { className: "placeholder", textContent: "image missing on disk: " + src }));
    wrap.innerHTML = "";
    wrap.appendChild(img);
  }
  meta.textContent = (src || shots.live || shots.ref || "") + note;
}

function initCompare() {
  const cmp = $("#cmp"); if (!cmp) return;
  const base = cmp.querySelector("img");
  const top = cmp.querySelector(".top"), topImg = top.querySelector("img"), handle = cmp.querySelector(".handle");
  function setPos(frac) {
    frac = Math.max(0.02, Math.min(0.98, frac));
    top.style.width = (frac * 100) + "%";
    handle.style.left = `calc(${frac * 100}% - 1px)`;
  }
  function sync() { topImg.style.width = base.clientWidth + "px"; setPos(0.5); }
  base.complete ? sync() : (base.onload = sync);
  let drag = false;
  const move = (x) => { const r = cmp.getBoundingClientRect(); setPos((x - r.left) / r.width); };
  handle.onpointerdown = (ev) => { drag = true; handle.setPointerCapture(ev.pointerId); };
  handle.onpointermove = (ev) => drag && move(ev.clientX);
  handle.onpointerup = () => drag = false;
  cmp.onclick = (ev) => { if (ev.target !== handle) move(ev.clientX); };
  new ResizeObserver(() => { topImg.style.width = base.clientWidth + "px"; }).observe(base);
}

// ---------------------------------------------------------------------------- details
function diffsTable(title, rows, cols) {
  if (!rows || !rows.length) return "";
  return `<div style="margin-top:8px"><b style="font-size:12px">${esc(title)}</b><table class="difftable"><tr>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr>` +
    rows.slice(0, 12).map((r) => `<tr>${cols.map((c) => `<td>${esc(typeof r[c] === "object" ? JSON.stringify(r[c]) : r[c] ?? "")}</td>`).join("")}</tr>`).join("") +
    `</table>${rows.length > 12 ? `<span style="color:var(--fg-faint);font-size:11px">…and ${rows.length - 12} more</span>` : ""}</div>`;
}

function renderDetails() {
  const e = EVENTS[sel];
  const d = $("#details");
  if (!e) {
    d.innerHTML = EVENTS.length
      ? `<h3>Run replay</h3><div style="color:var(--fg-dim)">Pick an event: click the timeline, a filmstrip frame, or press <kbd>→</kbd>.<br><br>` +
        `Red ticks are failures, amber are warnings (plateau / timeouts / pauses). Use <b>issues only</b> to jump straight to where the run went wrong.</div>`
      : `<h3>No events recorded</h3><div style="color:var(--fg-dim)">This phase has no <code style="font-family:var(--mono)">obs/events.jsonl</code> yet. Events are recorded automatically once the instrumented pipeline runs.</div>`;
    return;
  }
  const sev = sevOf(e);
  const chips = [`<span class="chip ${sev === "neutral" ? "" : sev}">${esc(e.type)}</span>`];
  if (e.stage) chips.push(`<span class="chip">stage: ${esc(e.stage)}</span>`);
  if (e.blockId) chips.push(`<span class="chip">loop: ${esc(e.blockId)}</span>`);
  if (e.iter != null) chips.push(`<span class="chip">iteration ${esc(e.iter)}</span>`);
  if (e.ok === true) chips.push(`<span class="chip ok">OK</span>`);
  if (e.ok === false) chips.push(`<span class="chip bad">FAIL</span>`);
  const sig = e.data && e.data.signals;
  if (sig) for (const [k, on] of Object.entries(sig)) if (on) chips.push(`<span class="chip warn">${esc(k)}</span>`);
  if (e.data && e.data.verdict) chips.push(`<span class="chip ${e.data.verdict === "PASS" || e.data.verdict === "CONTINUE" ? "ok" : e.data.verdict === "ESCALATE" ? "warn" : "bad"}">${esc(e.data.verdict)}</span>`);

  let body = "";
  if (e.data) {
    if (typeof e.data.diffCount === "number") body += `<div class="kv"><span class="k">diffCount</span><span class="v" style="color:${e.data.diffCount === 0 ? "var(--ok)" : "var(--bad)"}">${e.data.diffCount}</span></div>`;
    const del = e.data.delta;
    if (del) body += `<div class="kv"><span class="k">delta-compare</span><span class="v">${del.ok ? "clean" : `${del.diffs ?? "?"} diff(s)`} · ${del.checked ?? "?"} checked</span></div>`;
    if (e.data.stability) body += `<div class="kv"><span class="k">stability</span><span class="v">${e.data.stability.ok ? "ok" : "FAIL — a target shifts mid-interaction"}</span></div>`;
    if (e.data.contract) body += `<div class="kv"><span class="k">contract</span><span class="v">${e.data.contract.ok ? "ok" : (e.data.contract.violations ?? "?") + " violation(s)"}</span></div>`;
    if (e.data.reason) body += `<div class="kv"><span class="k">reason</span><span class="v" style="color:var(--bad)">${esc(e.data.reason)}</span></div>`;
    if (e.data.note) body += `<div class="kv"><span class="k">note</span><span class="v">${esc(e.data.note)}</span></div>`;
    body += diffsTable("Delta diffs (element · property · expected → rendered)", e.data.deltaDiffs, ["element", "property", "expected", "rendered", "note"]);
    body += diffsTable("Contract violations", e.data.contractViolations, ["part", "kind", "note"]);
    body += diffsTable("Smoke steps", e.data.steps, ["name", "ok", "error"]);
  }
  const arts = e.artifacts ? Object.entries(e.artifacts).map(([k, p]) => `<a class="art" href="${esc(rel(p))}" target="_blank">${esc(k)}</a>`).join(" · ") : "";

  d.innerHTML = `<h3>#${e._i + 1} · ${esc(e.summary || e.type)}</h3>
    <div class="chips">${chips.join("")}</div>
    <div class="kv">
      <span class="k">time</span><span class="v">${esc(e.t)} <span style="color:var(--fg-faint)">(+${fmtDur(new Date(e.t) - T0)})</span></span>
      <span class="k">source</span><span class="v">${esc(e.src || "?")}</span>
    </div>
    ${body}
    ${arts ? `<div style="margin-top:8px;font-size:12px;color:var(--fg-faint)">artifacts: ${arts}</div>` : ""}
    <details class="raw"><summary>raw event JSON</summary><pre class="json">${esc(JSON.stringify(e, null, 2))}</pre></details>`;
}

// ---------------------------------------------------------------------------- timeline canvas
const tlc = $("#tlc"), tl = $("#tl");
function xOf(t, w) { return 8 + (new Date(t) - T0) / SPAN * (w - 16); }

function stageBands() {
  const bands = [];
  const st = (RUN.stageState && RUN.stageState.stages) || {};
  for (const [name, s] of Object.entries(st)) if (s.startedAt)
    bands.push({ name, from: new Date(s.startedAt).getTime(), to: s.endedAt ? new Date(s.endedAt).getTime() : T1 });
  // derive a fix/measure band from block-level events when no explicit stage covers them
  const bt = EVENTS.filter((e) => ["measure", "measure.fail", "iter.record"].includes(e.type)).map((e) => new Date(e.t).getTime());
  if (bt.length) bands.push({ name: "measure/fix", from: Math.min(...bt), to: Math.max(...bt), derived: true });
  return bands;
}

function drawTimeline() {
  const w = tl.clientWidth, h = tl.clientHeight;
  const dpr = window.devicePixelRatio || 1;
  tlc.width = w * dpr; tlc.height = h * dpr;
  const g = tlc.getContext("2d");
  g.scale(dpr, dpr);
  g.clearRect(0, 0, w, h);

  // stall shading
  for (const s of (LOOP.stalls || [])) {
    const a = xOf(s.from, w), b = xOf(s.to || RUN.generatedAt, w);
    g.fillStyle = "rgba(217,161,59,.10)"; g.fillRect(a, 0, Math.max(2, b - a), h);
  }
  // stage bands
  const bands = stageBands();
  g.font = "9px ui-monospace,monospace"; g.textBaseline = "top";
  bands.forEach((b, i) => {
    const a = xOf(b.from, w), z = xOf(b.to, w);
    g.fillStyle = b.derived ? "rgba(90,162,255,.07)" : "rgba(90,162,255,.12)";
    g.fillRect(a, 14, Math.max(2, z - a), h - 34);
    g.fillStyle = "rgba(139,148,167,.9)";
    g.fillText(b.name, Math.max(2, a + 2), 2 + (i % 2) * 6);
  });
  // time axis labels
  g.fillStyle = "#5b6375"; g.font = "9px ui-monospace,monospace";
  for (let i = 0; i <= 4; i++) {
    const t = T0 + SPAN * i / 4;
    g.fillText(new Date(t).toISOString().slice(11, 19) + "Z", 8 + (w - 60) * i / 4, h - 10);
  }
  // event ticks: main lane; heartbeat logs on a low mini-lane
  for (const e of EVENTS) {
    if (!visible(e) && e._i !== sel) continue;
    const x = xOf(e.t, w);
    const isLog = e.type === "log";
    const y0 = isLog ? h - 22 : 18, y1 = isLog ? h - 16 : h - 26;
    g.strokeStyle = SEVC[sevOf(e)]; g.lineWidth = isLog ? 1 : e.shots && e.shots.live ? 2.5 : 1.5;
    g.globalAlpha = isLog ? .5 : 1;
    g.beginPath(); g.moveTo(x, y0); g.lineTo(x, y1); g.stroke();
    g.globalAlpha = 1;
  }
  // selection cursor
  if (sel >= 0) {
    const x = xOf(EVENTS[sel].t, w);
    g.strokeStyle = "#dbe2ee"; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(x, 4); g.lineTo(x, h - 8); g.stroke();
    g.fillStyle = "#dbe2ee";
    g.beginPath(); g.moveTo(x - 4, 0); g.lineTo(x + 4, 0); g.lineTo(x, 6); g.closePath(); g.fill();
  }
}

function nearestVisible(clientX) {
  const r = tl.getBoundingClientRect();
  const ids = visibleIdx();
  if (!ids.length) return -1;
  let best = ids[0], bd = Infinity;
  for (const i of ids) {
    const d = Math.abs(xOf(EVENTS[i].t, r.width) - (clientX - r.left));
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}
tl.addEventListener("click", (ev) => { const i = nearestVisible(ev.clientX); if (i >= 0) select(i); });
tl.addEventListener("mousemove", (ev) => {
  const i = nearestVisible(ev.clientX);
  const tip = $("#tltip");
  if (i < 0) { tip.style.display = "none"; return; }
  const e = EVENTS[i];
  tip.innerHTML = `<div class="t">${esc(fmtT(e.t))} · #${e._i + 1} · ${esc(e.type)}${e.blockId ? " · " + esc(e.blockId) : ""}${e.iter != null ? " · iter " + e.iter : ""}</div><div>${esc(e.summary || "")}</div>`;
  tip.style.display = "block";
  tip.style.left = Math.min(ev.clientX + 12, innerWidth - 440) + "px";
  tip.style.top = (ev.clientY - 54) + "px";
});
tl.addEventListener("mouseleave", () => $("#tltip").style.display = "none");

// ---------------------------------------------------------------------------- filmstrip
function renderStrip() {
  const frames = EVENTS.filter((e) => visible(e) && e.shots && e.shots.live);
  $("#strip").innerHTML = frames.map((e) =>
    `<div class="fr${e._i === sel ? " sel" : ""}" data-i="${e._i}" title="${esc(e.summary || e.type)}">` +
    `<img loading="lazy" src="${esc(rel(e.shots.live))}" alt="" onerror="this.style.display='none'">` +
    `<div class="cap" style="color:${SEVC[sevOf(e)]}">${esc((e.blockId || e.type).slice(0, 14))}${e.iter != null ? "·i" + e.iter : ""}</div></div>`).join("") ||
    `<div style="color:var(--fg-faint);font-size:11px;padding:2px 4px">no screenshots match the current filter</div>`;
  $("#strip").querySelectorAll(".fr").forEach((el) => el.onclick = () => select(+el.dataset.i));
  const cur = $("#strip .fr.sel");
  if (cur) cur.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
}

// ---------------------------------------------------------------------------- selection / playback
function select(i) {
  sel = i;
  const e = EVENTS[sel];
  $("#poslbl").textContent = e ? `event ${visibleIdx().indexOf(sel) + 1}/${visibleIdx().length} · ${fmtT(e.t)} (+${fmtDur(new Date(e.t) - T0)})` : `0/${visibleIdx().length}`;
  renderViewer(); renderDetails(); drawTimeline(); renderStrip();
}
function step(dir) {
  const ids = visibleIdx();
  if (!ids.length) return;
  const pos = ids.indexOf(sel);
  const next = pos < 0 ? (dir > 0 ? 0 : ids.length - 1) : Math.max(0, Math.min(ids.length - 1, pos + dir));
  select(ids[next]);
}
function setPlaying(on) {
  playing = on;
  $("#btnPlay").textContent = on ? "❚❚ Pause" : "▶ Play";
  $("#btnPlay").classList.toggle("active", on);
  clearInterval(playTimer);
  if (on) playTimer = setInterval(() => {
    const ids = visibleIdx();
    if (!ids.length || sel === ids[ids.length - 1]) return setPlaying(false);
    step(1);
  }, +$("#speed").value);
}
$("#btnPlay").onclick = () => setPlaying(!playing);
$("#btnPrev").onclick = () => step(-1);
$("#btnNext").onclick = () => step(1);
$("#btnFirst").onclick = () => { const ids = visibleIdx(); if (ids.length) select(ids[0]); };
$("#btnLast").onclick = () => { const ids = visibleIdx(); if (ids.length) select(ids[ids.length - 1]); };
$("#speed").onchange = () => playing && setPlaying(true);
document.addEventListener("keydown", (ev) => {
  if (ev.target.tagName === "INPUT") return;
  if (ev.key === "ArrowLeft") { step(-1); ev.preventDefault(); }
  else if (ev.key === "ArrowRight") { step(1); ev.preventDefault(); }
  else if (ev.key === " ") { setPlaying(!playing); ev.preventDefault(); }
});
$("#vtabs").querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => {
  tab = b.dataset.tab;
  $("#vtabs").querySelectorAll("[data-tab]").forEach((x) => x.classList.toggle("active", x === b));
  renderViewer();
});
$("#fitBtn").onclick = () => { fitMode = !fitMode; renderViewer(); };
for (const id of ["showLogs", "onlyIssues"]) $("#" + id).onchange = renderAll;
$("#q").oninput = renderAll;
window.addEventListener("resize", drawTimeline);

function renderAll() { renderRail(); renderViewer(); renderDetails(); drawTimeline(); renderStrip(); }

// initial selection: first bad event if any (the "pinpoint where it broke" default), else first event
(function init() {
  renderRail();
  const firstBad = EVENTS.find((e) => sevOf(e) === "bad");
  if (firstBad) select(firstBad._i);
  else if (EVENTS.length) select(EVENTS[0]._i);
  else { renderViewer(); renderDetails(); drawTimeline(); renderStrip(); $("#poslbl").textContent = "0/0"; }
})();
</script>
</body>
</html>
